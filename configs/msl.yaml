# VisTAD Configuration: MSL (Mars Science Laboratory Telemetry)
dataset:
  name: "msl"
  entity: "msl_test"
  data_dir: "data"
  window_size: 200
  stride: 100
  baseline_steps: 3000

channel_filter:
  strategy: "median_shift"
  k: 6

student:
  architecture: "cnn_1d"
  channel_independent: true
  hidden_dim: 128
  num_layers: 3
  dropout: 0.1
  teacher_feat_dim: 2048

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  temperature: 2.0
  device: "cuda"
  checkpoint_dir: "checkpoints"
  pos_weight: 4.0
  loss_weights:
    w_sup: 1.5
    w_feat: 0.05
    w_resp: 0.2

teacher:
  model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  cache_dir: "cache"
  macro_context_len: 800
  norm_mode: "rolling"
  decision_threshold: 0.68
  min_pixels: 100352
  max_pixels: 200704
