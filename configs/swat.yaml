# VisTAD Configuration: SWaT (Secure Water Treatment)
dataset:
  name: "swat"
  entity: "swat_attack"
  data_dir: "data"
  window_size: 200
  stride: 100
  baseline_steps: 5000

channel_filter:
  strategy: "median_shift"
  k: 6

student:
  architecture: "cnn_1d"
  channel_independent: true
  hidden_dim: 128
  num_layers: 3
  dropout: 0.1
  teacher_feat_dim: 2048

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  temperature: 2.0
  device: "cuda"
  checkpoint_dir: "checkpoints"
  loss_weights:
    w_sup: 1.0
    w_feat: 0.1
    w_resp: 1.0

teacher:
  model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
  cache_dir: "cache"
  macro_context_len: 800
  decision_threshold: 0.63
  min_pixels: 100352
  max_pixels: 200704
