version: '2.0'
description: Master Model Evaluation Registry for VisTAD Streamlit Serving
default_dataset: swat
datasets:
  swat:
    name: SWaT Water Treatment SCADA (51 Channels)
    domain: SWaT
    channels: 51
    entity: swat_attack
    sample_file: test_swat_water_scada.csv
    default_model: swat_old_student_new_cache
    default_start: 1500
    default_len: 3000
  gecco:
    name: GECCO Drinking Water Monitoring (9 Channels)
    domain: GECCO
    channels: 9
    entity: gecco_water
    sample_file: test_gecco_water.csv
    default_model: gecco_old_student_new_cache
    default_start: 60000
    default_len: 2500
  smd:
    name: SMD Cloud Computing Servers (38 Channels)
    domain: SMD
    channels: 38
    entity: machine-1-1
    sample_file: test_server_smd.csv
    default_model: smd_best_loss_tuned
    default_start: 15000
    default_len: 3000
  msl:
    name: NASA MSL Mars Rover (55 Channels)
    domain: MSL
    channels: 55
    entity: msl_test
    sample_file: test_spacecraft_msl.csv
    default_model: msl_old_student_new_cache
    default_start: 27000
    default_len: 3000
families:
  coupled_domain:
    name: Coupled Domain TCN (Ours)
    badge: Flagship (Ours)
    order: 1
    desc: Subsystem-decoupled causal TCN tailored to physical plant topology and multi-stage
      industrial dependencies.
  foundation_pro:
    name: Universal Foundation TCN Pro
    badge: Any-Dimension Foundation
    order: 2
    desc: Permutation-equivariant Transformer + TCN foundation model operating on
      arbitrary telemetry dimensions without reconfiguration.
  channel_aware:
    name: Universal Channel-Aware TCN
    badge: Channel-Aware
    order: 3
    desc: Universal student with learned channel identity representations and cross-sensor
      attention.
  loss_tuned:
    name: Best Loss-Tuned Student
    badge: Optimal Loss
    order: 4
    desc: Optimal loss-ablation configuration tuning supervision vs distillation.
  baseline_cnn:
    name: 1D-CNN (3L) Baseline
    badge: Baseline (3L)
    order: 5
    desc: Standard 3-layer channel-independent 1D-CNN baseline.
  baseline_tcn:
    name: Residual-TCN (5L) Baseline
    badge: Baseline (5L)
    order: 6
    desc: Standard 5-layer dilated residual causal TCN baseline.
